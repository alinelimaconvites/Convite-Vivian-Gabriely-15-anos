<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>15 Anos Vivian Gabriely</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #020b26;
    }

    .convite {
      position: relative;
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      line-height: 0;
    }

    .convite img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Estilo genérico das áreas clicáveis */
    .area-clique {
      position: absolute;
      display: block;
      z-index: 10;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

   /* 
      BOTÃO REDONDO DE PLAY (MÚSICA) - REAJUSTADO
    */
    .btn-musica {
      right: 7%;
      top: 4.8%;
      width: 14%;
      height: 1.4%;
      border-radius: 50%;
      border: 2px solid red; /* TESTE VISUAL: Apague esta linha depois! */
    }

    /* Botões Principais */
    .btn-principal {
      left: 12%;
      width: 76%;
      height: 2.6%;
    }

    .localizacao { top: 48.8%; }
    .presentes   { top: 52.4%; }
    .dresscode   { top: 55.8%; }
    .confirmacao { top: 59.4%; }

    /* Contagem Regressiva */
    .contagem {
      left: 15%;
      top: 63.2%;
      width: 70%;
      height: 3.2%;
    }

    /* Botões "Voltar ao Topo" (Setas) */
    .topo-seta {
      width: 10%;
      height: 1.5%;
    }

    .topo-dresscode {
      left: 4%;
      top: 83.3%;
    }

    .topo-presentes {
      right: 4%;
      top: 98.2%;
    }

    /* Destinos invisíveis para a rolagem interna */
    .destino {
      position: absolute;
      left: 0;
      width: 1px;
      height: 1px;
      scroll-margin-top: 20px;
    }

    #destino-dresscode { top: 70.8%; }
    #destino-presentes { top: 85.5%; }
  </style>
</head>

<body>
  <main class="convite" id="topo">

    <img src="convite.png" alt="Convite de 15 anos - Vivian Gabriely">

    <!-- Áudio da Música (Certifique-se de que o arquivo 'musica.mp3' está na mesma pasta!) -->
    <audio id="musica-convite" src="musica.mp3" preload="auto" loop></audio>

    <!-- 0. Botão Redondo Aperte o Play -->
    <button
      class="area-clique btn-musica"
      onclick="alternarMusica()"
      aria-label="Tocar ou pausar música"
    ></button>

    <!-- Destinos das âncoras internas -->
    <span class="destino" id="destino-dresscode"></span>
    <span class="destino" id="destino-presentes"></span>

    <!-- 1. Localização -->
    <a
      class="area-clique btn-principal localizacao"
      href="https://www.google.com/maps/place/R.+da+Felicidade,+616+-+Alto+Nova+Olinda,+Olinda+-+PE,+53200-240/@-7.989263,-34.8893531,16z/data=!4m6!3m5!1s0x7ab1778661d1783:0x83fef0c84294fc66!8m2!3d-7.989263!4d-34.8893531!16s%2Fg%2F11ybly0gv_?g_ep=Eg1tbF8yMDI2MTAxM18wIJvbDyoASAJQAg%3D%3D"
      target="_blank"
      rel="noopener"
      aria-label="Local da Festa"
    ></a>

    <!-- 2. Sugestão de presentes -->
    <a
      class="area-clique btn-principal presentes"
      href="#destino-presentes"
      aria-label="Sugestão de presentes"
    ></a>

    <!-- 3. Dress code -->
    <a
      class="area-clique btn-principal dresscode"
      href="#destino-dresscode"
      aria-label="Dress code"
    ></a>

    <!-- 4. Confirmação pelo WhatsApp -->
    <a
      class="area-clique btn-principal confirmacao"
      href="https://wa.me/5581984080642?text=Confirmo%20minha%20presen%C3%A7a!"
      target="_blank"
      rel="noopener"
      aria-label="Confirmar presença"
    ></a>

    <!-- 5. Contagem Regressiva -->
    <a
      class="area-clique contagem"
      href="https://onlinealarmkur.com/countdown/pt/#2026-11-28T16%3A00%26tz%3DAmerica%2FRecife%26title%3D15%2520Anos%2520de%2520Vivian%2520Gabriely"
      target="_blank"
      rel="noopener"
      aria-label="Acompanhe a contagem regressiva"
    ></a>

    <!-- 6. Voltar ao Topo 1 -->
    <a
      class="area-clique topo-seta topo-dresscode"
      href="#topo"
      aria-label="Voltar ao topo"
    ></a>

    <!-- 7. Voltar ao Topo 2 -->
    <a
      class="area-clique topo-seta topo-presentes"
      href="#topo"
      aria-label="Voltar ao topo"
    ></a>

  </main>

  <script>
    function alternarMusica() {
      const audio = document.getElementById('musica-convite');
      if (audio.paused) {
        audio.play().catch(error => {
          console.error("Erro ao tocar música:", error);
          alert("Não foi possível tocar o áudio. Verifique se o arquivo 'musica.mp3' está salvo na mesma pasta do arquivo HTML!");
        });
      } else {
        audio.pause();
      }
    }
  </script>
</body>
</html>
