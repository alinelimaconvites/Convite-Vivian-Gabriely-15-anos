
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convite de 15 anos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #fff8f2;
    }

    .convite {
      position: relative;
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      line-height: 0;
    }

    .convite img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Áreas transparentes sobre os botões originais */
    .area-clique {
      position: absolute;
      display: block;
      z-index: 10;
      left: 10%;
      width: 80%;
      height: 1.8%;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /*
      POSIÇÕES PROVISÓRIAS.
      Os valores são relativos à altura TOTAL da imagem.
      Precisam coincidir com os botões desenhados.
    */
    .localizacao {
      top: 5%;
    }

    .presentes {
      top: 8%;
    }

    .dresscode {
      top: 11%;
    }

    .confirmacao {
      top: 14%;
    }

    /* Destinos invisíveis dentro da própria imagem */
    .destino {
      position: absolute;
      left: 0;
      width: 1px;
      height: 1px;
      scroll-margin-top: 12px;
    }

    /*
      POSIÇÕES PROVISÓRIAS DOS DESTINOS.
      Ajustar para a altura em que cada informação
      aparece no final da imagem.
    */
    #destino-presentes {
      top: 82%;
    }

    #destino-dresscode {
      top: 90%;
    }
  </style>
</head>

<body>
  <main class="convite" id="topo">

    <img src="convite.png" alt="Convite de 15 anos">

    <!-- Destinos invisíveis: não acrescentam conteúdo visual -->
    <span class="destino" id="destino-presentes"></span>
    <span class="destino" id="destino-dresscode"></span>

    <!-- 1. Localização -->
    <a
      class="area-clique localizacao"
      href="https://www.google.com/maps/place/R.+da+Felicidade,+616+-+Alto+Nova+Olinda,+Olinda+-+PE,+53200-240/@-7.989263,-34.8893531,16z/data=!4m6!3m5!1s0x7ab1778661d1783:0x83fef0c84294fc66!8m2!3d-7.989263!4d-34.8893531!16s%2Fg%2F11ybly0gv_?g_ep=Eg1tbF8yMDI2MTAxM18wIJvbDyoASAJQAg%3D%3D"
      target="_blank"
      rel="noopener"
      aria-label="Localização"
    ></a>

    <!-- 2. Sugestão de presentes -->
    <a
      class="area-clique presentes"
      href="#destino-presentes"
      aria-label="Sugestão de presentes"
    ></a>

    <!-- 3. Dress code -->
    <a
      class="area-clique dresscode"
      href="#destino-dresscode"
      aria-label="Dress code"
    ></a>

    <!-- 4. Confirmação pelo WhatsApp -->
    <a
      class="area-clique confirmacao"
      href="https://wa.me/5581984080642?text=Confirmo%20minha%20presen%C3%A7a!"
      target="_blank"
      rel="noopener"
      aria-label="Confirmar presença"
    ></a>

  </main>
</body>
</html>
