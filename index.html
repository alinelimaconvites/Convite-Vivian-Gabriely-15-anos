

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f2">
  <title>Convite de 15 anos</title>

  <style>
    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fff8f2;
      font-family: Arial, sans-serif;
      color: #604a50;
    }

    main {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .convite {
      position: relative;
      width: 100%;
    }

    .arte {
      display: block;
      width: 100%;
      height: auto;
    }

    .area-clique {
      position: absolute;
      display: block;
      background: transparent;
      border: 0;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .area-clique:focus-visible {
      outline: 2px dashed #604a50;
    }

    .musica {
      padding: 20px;
      text-align: center;
    }

    audio {
      width: 100%;
    }
  </style>
</head>

<body>
  <main>
    <section class="convite" id="convite"
             aria-label="Convite interativo de 15 anos">

      <img
        class="arte"
        src="convite.png"
        alt="Convite de aniversário de 15 anos"
      >

      <!-- BOTÃO SUGESTÃO DE PRESENTES -->
      <button
        class="area-clique"
        aria-label="Ir para sugestão de presentes"
        style="left: 5%; top: 5%; width: 40%; height: 2%;"
        onclick="irParaParte(85)">
      </button>

      <!-- BOTÃO DRESS CODE -->
      <button
        class="area-clique"
        aria-label="Ir para dress code"
        style="left: 50%; top: 5%; width: 40%; height: 2%;"
        onclick="irParaParte(93)">
      </button>

      <!-- ADICIONE OUTRAS ÁREAS CLICÁVEIS AQUI -->

    </section>

    <!-- ÁUDIO OPCIONAL -->
    <section class="musica">
      <p>Uma música para esse momento 🎵</p>
      <audio controls preload="none">
        <source src="musica.mp3" type="audio/mpeg">
        Seu navegador não consegue reproduzir este áudio.
      </audio>
    </section>
  </main>

  <script>
    /*
      O número indica a porcentagem da altura da imagem.
      Exemplo: 85 significa 85% da altura do convite.
    */
    function irParaParte(percentual) {
      const convite = document.getElementById("convite");
      const altura = convite.getBoundingClientRect().height;
      const inicio = window.scrollY +
        convite.getBoundingClientRect().top;

      const destino = inicio + altura * (percentual / 100);

      window.scrollTo({
        top: destino,
        behavior: "smooth"
      });
    }
  </script>
</body>
</html>
