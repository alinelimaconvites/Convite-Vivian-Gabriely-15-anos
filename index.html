
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f2">
  <title>Convite de 15 anos</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8f2;
      color: #604a50;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 12px;
    }

    .convite {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 177.7778%;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 2px 10px #00000018;
    }

    .convite iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    h1 {
      font-size: 1.6rem;
      margin-top: 28px;
    }

    p { line-height: 1.5; }

    .contador {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .tempo {
      background: #ffffff;
      border: 1px solid #efd8d5;
      border-radius: 12px;
      padding: 12px 8px;
      min-width: 68px;
    }

    .tempo strong {
      display: block;
      font-size: 1.5rem;
    }

    .tempo span { font-size: .8rem; }

    .botoes {
      display: grid;
      gap: 12px;
      margin: 24px 0;
    }

    .botao {
      display: block;
      padding: 15px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      background: #dba9b5;
      color: #402d34;
      border: 0;
      cursor: pointer;
    }

    .botao:focus-visible {
      outline: 3px solid #604a50;
      outline-offset: 3px;
    }

    .musica {
      background: #ffffff;
      padding: 18px;
      border-radius: 14px;
      margin: 20px 0;
    }

    audio { width: 100%; }

    footer {
      padding: 20px 0;
      font-size: .85rem;
    }
  </style>
</head>

<body>
  <main>
    <!-- CONVITE DO CANVA -->
    <section class="convite" aria-label="Convite de aniversário">
      <iframe
        src="https://www.canva.com/design/DAHYagAzJm4/Q_zbvlM1-LOQOQzbceUCbA/view?embed"
        title="Convite de 15 anos"
        loading="lazy"
        allowfullscreen>
      </iframe>
    </section>

    <!-- CONTAGEM REGRESSIVA -->
    <section>
      <h1>Estamos te esperando! ✨</h1>
      <p>Falta pouco para esse dia especial.</p>

      <div class="contador" aria-live="polite">
        <div class="tempo"><strong id="dias">--</strong><span>Dias</span></div>
        <div class="tempo"><strong id="horas">--</strong><span>Horas</span></div>
        <div class="tempo"><strong id="minutos">--</strong><span>Minutos</span></div>
        <div class="tempo"><strong id="segundos">--</strong><span>Segundos</span></div>
      </div>

      <p id="mensagem-contador"></p>
    </section>

    <!-- BOTÕES INTERATIVOS -->
    <section class="botoes" aria-label="Informações da festa">
      <a class="botao" id="whatsapp" href="#" target="_blank"
         rel="noopener">💌 Confirmar presença</a>

      <a class="botao" id="mapa" href="#" target="_blank"
         rel="noopener">📍 Ver localização</a>

      <a class="botao" id="presentes" href="#" target="_blank"
         rel="noopener">🎁 Lista de presentes</a>
    </section>

    <!-- MÚSICA -->
    <section class="musica">
      <h2>Uma música para esse momento 🎵</h2>
      <p>Toque no play para ouvir.</p>
      <audio controls preload="none">
        <source src="musica.mp3" type="audio/mpeg">
        Seu navegador não consegue reproduzir este áudio.
      </audio>
    </section>

    <footer>Feito com carinho 💕</footer>
  </main>

  <script>
    /*
      PREENCHA OS DADOS DA FESTA AQUI.
      Use o formato indicado nos exemplos.
    */

    const dataFesta = "2027-01-15T19:00:00-03:00";
    const telefoneWhatsApp = "5511999999999";
    const mensagemWhatsApp =
      "Olá! Confirmo minha presença na festa de 15 anos!";

    const enderecoFesta = "COLOQUE O ENDEREÇO DA FESTA AQUI";
    const linkListaPresentes = "COLOQUE O LINK DA LISTA DE PRESENTES AQUI";

    // Monta os links dos botões
    document.getElementById("whatsapp").href =
      "https://wa.me/" + telefoneWhatsApp +
      "?text=" + encodeURIComponent(mensagemWhatsApp);

    document.getElementById("mapa").href =
      "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(enderecoFesta);

    document.getElementById("presentes").href =
      linkListaPresentes;

    // Atualiza a contagem regressiva
    const destino = new Date(dataFesta).getTime();

    function atualizarContagem() {
      const agora = Date.now();
      const diferenca = destino - agora;

      if (Number.isNaN(destino)) {
        document.getElementById("mensagem-contador").textContent =
          "Confira a data da festa.";
        return;
      }

      if (diferenca <= 0) {
        ["dias", "horas", "minutos", "segundos"].forEach(id => {
          document.getElementById(id).textContent = "0";
        });

        document.getElementById("mensagem-contador").textContent =
          "Chegou o grande dia! 🎉";
        return;
      }

      const dia = Math.floor(diferenca / 86400000);
      const hora = Math.floor((diferenca % 86400000) / 3600000);
      const minuto = Math.floor((diferenca % 3600000) / 60000);
      const segundo = Math.floor((diferenca % 60000) / 1000);

      document.getElementById("dias").textContent = dia;
      document.getElementById("horas").textContent = hora;
      document.getElementById("minutos").textContent = minuto;
      document.getElementById("segundos").textContent = segundo;
      document.getElementById("mensagem-contador").textContent = "";
    }

    atualizarContagem();
    setInterval(atualizarContagem, 1000);
  </script>
</body>
</html>
