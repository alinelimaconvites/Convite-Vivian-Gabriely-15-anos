<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convite de 15 anos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #020b26;
    }

    .convite {
      position: relative;
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      line-height: 0;
    }

    .convite img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Estilo genérico das áreas clicáveis */
    .area-clique {
      position: absolute;
      display: block;
      z-index: 10;
      left: 12%;
      width: 76%;
      height: 2.6%;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* 
      POSIÇÕES AJUSTADAS COM BASE NA IMAGEM:
    */
    /* 1. Local da Festa */
    .localizacao {
      top: 48.8%;
    }

    /* 2. Sugestão de Presentes */
    .presentes {
      top: 52.4%;
    }

    /* 3. Dress Code */
    .dresscode {
      top: 55.8%;
    }

    /* 4. Confirme sua Presença */
    .confirmacao {
      top: 59.4%;
    }

    /* Destinos invisíveis para a rolagem da página */
    .destino {
      position: absolute;
      left: 0;
      width: 1px;
      height: 1px;
      scroll-margin-top: 20px;
    }

    /* Posições das seções de destino no final da imagem */
    #destino-dresscode {
      top: 71.5%;
    }

    #destino-presentes {
      top: 87.0%;
    }
  </style>
</head>

<body>
  <main class="convite" id="topo">

    <img src="convite.png" alt="Convite de 15 anos - Vivian Gabriely">

    <!-- Destinos das âncoras internas -->
    <span class="destino" id="destino-dresscode"></span>
    <span class="destino" id="destino-presentes"></span>

    <!-- 1. Localização (Abre Google Maps) -->
    <a
      class="area-clique localizacao"
      href="https://www.google.com/maps/place/R.+da+Felicidade,+616+-+Alto+Nova+Olinda,+Olinda+-+PE,+53200-240/@-7.989263,-34.8893531,16z/data=!4m6!3m5!1s0x7ab1778661d1783:0x83fef0c84294fc66!8m2!3d-7.989263!4d-34.8893531!16s%2Fg%2F11ybly0gv_?g_ep=Eg1tbF8yMDI2MTAxM18wIJvbDyoASAJQAg%3D%3D"
      target="_blank"
      rel="noopener"
      aria-label="Local da Festa"
    ></a>

    <!-- 2. Sugestão de presentes (Rola para a seção de presentes) -->
    <a
      class="area-clique presentes"
      href="#destino-presentes"
      aria-label="Sugestão de presentes"
    ></a>

    <!-- 3. Dress code (Rola para a seção de dress code) -->
    <a
      class="area-clique dresscode"
      href="#destino-dresscode"
      aria-label="Dress code"
    ></a>

    <!-- 4. Confirmação pelo WhatsApp -->
    <a
      class="area-clique confirmacao"
      href="https://wa.me/5581984080642?text=Confirmo%20minha%20presen%C3%A7a!"
      target="_blank"
      rel="noopener"
      aria-label="Confirmar presença"
    ></a>

  </main>
</body>
</html>
